<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도우 인스타">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>도우 인스타 승인함</title>
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#202124;--sub:#71717a;--brand:#242424;--ok:#222;--warn:#a75818;--bad:#b3261e;--line:#e8e8e8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus,textarea:focus{outline:2px solid #5477b0;outline-offset:2px}
#app{max-width:480px;margin:auto;min-height:100vh}header{background:#fff;padding:22px 18px 16px;border-bottom:1px solid var(--line)}header h1{font-size:21px;margin:0;letter-spacing:-.5px}.who{font-size:12px;color:var(--sub);margin-top:3px}nav{display:flex;background:#fff;overflow-x:auto;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);scrollbar-width:none}nav button{flex:1 0 auto;border:0;border-bottom:2px solid transparent;background:#fff;padding:13px 9px;color:var(--sub);font-size:13px;font-weight:600}nav button.on{color:#111;border-bottom-color:#111}.n{font-size:11px;background:#f0f0f0;border-radius:12px;padding:2px 5px;margin-left:3px}main{padding:12px 12px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}.ig-head{display:flex;align-items:center;padding:12px;gap:10px}.avatar{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:1px solid #ddd;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:1px}.ig-name{flex:1;min-width:0;line-height:1.4}.ig-name b{font-size:13px;display:block}.ig-name span{font-size:11px;color:var(--sub);display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.version{border:1px solid #e8e8e8;border-radius:4px;padding:1px 5px;font-size:11px;color:#888}.media{position:relative}.pics{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#f6f6f6}.pics::-webkit-scrollbar{display:none}.pics img{flex:0 0 100%;width:100%;min-width:0;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:start;background:#fafafa}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;background:#ffffffdf;color:#222;width:30px;height:30px;font-size:24px;line-height:24px;box-shadow:0 1px 5px #0002}.prev{left:10px}.next{right:10px}.counter{position:absolute;right:10px;top:10px;background:#0008;color:#fff;padding:3px 8px;border-radius:12px;font-size:11px;pointer-events:none}.body{padding:13px}.title{font-size:16px;font-weight:700;margin:3px 0 8px}.cap,.tags{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.tags{color:#355a7f;margin-top:8px}.meta{font-size:12px;color:var(--sub);margin-top:12px;padding-top:9px;border-top:1px solid #f1f1f1}.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.btn{flex:1 1 100px;display:block;border:1px solid #222;border-radius:7px;padding:11px 8px;font-size:14px;font-weight:600;background:#222;color:#fff;min-height:44px}.btn.warn,.btn.ghost{background:#fff;color:#444;border-color:#ddd}.btn.bad{background:#fff;color:var(--bad);border-color:#e7b6b0}.empty{text-align:center;color:var(--sub);padding:50px 10px}.state{display:inline-block;border-radius:4px;padding:2px 6px;font-size:11px;background:#f2f2f2;color:#626262;margin-bottom:8px}.s-approval{background:#eef3fa;color:#385778}.s-scheduled,.s-published{background:#edf6ef;color:#357245}.s-review,.s-revision,.s-failed,.s-unknown{background:#fff4e8;color:#966029}.note,.err,.banner{padding:11px;border-radius:7px;font-size:13px;margin-top:10px;overflow-wrap:anywhere}.note,.banner.warn{background:#fff8eb;color:#74551f}.err,.banner.bad{background:#fff0ee;color:var(--bad)}.banner{margin:0 0 12px}.log{font-size:10px;color:#929292;margin-top:12px;border-top:1px solid #f0f0f0;padding-top:8px}.log div{margin:3px 0;overflow-wrap:anywhere}.small{font-size:12px;color:var(--sub)}.center{max-width:440px;margin:60px auto;padding:0 20px;text-align:center}.center h2{font-size:24px}.center input{max-width:100%;padding:12px;border:1px solid #ddd;border-radius:8px}.perm{display:block;font-size:13px;margin-top:10px;color:#355a7f}.section-title{font-size:18px;margin:18px 0 5px}.refreshbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:11px;color:#888}.refreshbar span{flex:1}.refresh{background:#fff;border:1px solid #ddd;border-radius:6px;padding:7px;white-space:nowrap;font-size:12px}.inline-editor label{display:block;font-size:12px;font-weight:600;margin-top:10px}.inline-editor input,.inline-editor textarea{display:block;width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;margin-top:5px;font-size:16px;color:var(--ink)}.inline-editor textarea{min-height:170px;resize:vertical;line-height:1.6}.inline-editor .tag-input{min-height:80px}.diff{margin-top:10px}.before,.after{padding:8px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:5px;margin-top:5px}.before{background:#fff0ee;color:#8f3a32}.after{background:#edf6ef;color:#286238}summary{cursor:pointer;margin-top:8px;font-size:12px}.linkbox{overflow-wrap:anywhere}a{color:#355a7f}@media(max-width:360px){nav button{padding:12px 7px;font-size:12px}main{padding:10px 7px 60px}.btn{font-size:13px}}
/* Reels are preview-only. Uploading/replacing media stays with the AI helper. */
[hidden]{display:none!important}.content-type{display:inline-block;margin:0 6px 8px 0;padding:2px 6px;border:1px solid var(--line);border-radius:4px;font-size:11px;color:#444}.reel-preview{background:#111;position:relative}.reel-preview video{display:block;width:100%;aspect-ratio:9/16;height:auto;object-fit:contain;background:#111}.reel-error{margin:0;border-radius:0}.reel-details{padding:0 13px 10px}.video-meta{margin:9px 0;overflow-wrap:anywhere}.reel-cover{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:8px 0 0;padding:9px;border:1px solid var(--line);border-radius:7px}.reel-cover img{display:block;width:54px;aspect-ratio:9/16;object-fit:cover;border-radius:4px}.reel-cover figcaption{font-size:12px;color:var(--sub)}.reel-cover .cover-error{flex-basis:100%;margin:0}#pending-refresh{font-size:12px}
</style>
</head>
<body>
<div id="app"><div class="center"><h2>불러오는 중…</h2></div></div>
<script type="module" src="app.js?v=10"></script>
</body>
</html>
